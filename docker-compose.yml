services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: docpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docpilot
      POSTGRES_PASSWORD: docpilot_dev_password
      POSTGRES_DB: docpilot
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docpilot -d docpilot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
